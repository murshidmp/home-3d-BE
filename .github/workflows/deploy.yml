name: Deploy to EC2 (Optimized)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t murshidmp/home_3d:latest .
          docker push murshidmp/home_3d:latest
        env:
          DOCKER_BUILDKIT: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Aggressive cleanup
            cd /home/ubuntu
            docker-compose down --remove-orphans || true

            # Remove all stopped containers, unused images, and dangling volumes
            docker container prune -f
            docker image prune -af
            docker volume prune -f

            # 2. Force cleanup (use with caution)
            docker system prune -af --volumes

            # 3. Disk usage report before deployment
            echo "Disk usage before deployment:"
            df -h /
            docker system df

            # 4. Pull and deploy NestJS app only (PostgreSQL is on host)
            docker-compose pull nest_app
            docker-compose up -d --remove-orphans

            # 5. Final disk check
            echo "Disk usage after deployment:"
            df -h /
            docker system df