version: "3.8"

services:
  # PostgreSQL Database
  postgres_db:
    image: postgres:14
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # NestJS Application
  nest_app:
    container_name: nest_app
    image: murshidmp/home_3d:latest  # Replace with your Docker Hub username and app name
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres_db

volumes:
  pgdata: