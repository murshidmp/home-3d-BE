services:
  postgres_db:
    image: postgres:14
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nest_app:
    image: murshidmp/home_3d:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres_db

volumes:
  pgdata: